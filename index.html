<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gg transcript viewer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .fallback {
      position: absolute; inset: 0; z-index: -1;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #555; text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <!-- The iframe covers this note; it stays visible only when the viewer
       server isn't running and the iframe renders nothing. -->
  <div class="fallback">
    <p>
      The transcript viewer isn't running.<br />
      Start it with <code>python3 viewer-server.py</code> (or run a
      transcription), then reload this pane.<br />
      Viewer URL: <code>http://127.0.0.1:8787/</code>
    </p>
  </div>
  <iframe src="http://127.0.0.1:8787/" title="Transcript viewer"></iframe>
</body>
</html>
